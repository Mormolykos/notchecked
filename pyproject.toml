[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notchecked"
version = "0.1.0"
description = "Coverage accounting for validators: what was checked, what could not be checked, and what was never in scope."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Panagiotis Gkilis" }]
keywords = ["validation", "coverage", "evaluation", "ci", "provenance", "compliance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["notchecked"]
